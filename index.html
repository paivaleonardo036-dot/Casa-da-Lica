<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nosso Lar</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#FBF5EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nosso Lar">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF5EC;--card:#FFFDF9;--ink:#3B2F27;--mut:#8C7D70;--line:#EFE3D3;--terra:#C96F4A;--terra2:#F7E0D3;--sage:#6F8F72;--sage2:#E1EBDD;--mel:#E0A43A;--mel2:#FBEDCC;--rosa:#D47A90;--rosa2:#F9E1E7;--red:#C4473C;--red2:#F8DEDA;--leo:#5F8A6A;--lica:#D47A90;--sh:0 1px 2px rgba(80,50,20,.05),0 8px 22px rgba(80,50,20,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4}
body{padding:env(safe-area-inset-top,0) 0 calc(92px + env(safe-area-inset-bottom,0))}
#app{max-width:620px;margin:0 auto;padding:12px 16px 24px}
h1,h2,.serif{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em}
h1{font-size:28px;margin:0}
h2{font-size:19px;margin:22px 4px 8px;display:flex;align-items:center;gap:8px}
small,.mut{color:var(--mut)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;outline:none;min-width:0}
input:focus,textarea:focus,select:focus{border-color:var(--terra)}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:16px;margin:10px 0;border:1px solid rgba(239,227,211,.7)}
.btn{background:var(--terra);color:#fff;font-weight:800;border-radius:14px;padding:11px 16px;white-space:nowrap;transition:transform .12s}
.btn:active,.tile:active,.chip:active{transform:scale(.96)}
.btn.soft{background:var(--terra2);color:var(--terra)}
.btn.sage{background:var(--sage)}
.btn.ghost{background:transparent;color:var(--mut);border:1.5px solid var(--line)}
.add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.add>input:first-child,.add>.grow{flex:1 1 160px}
.num{width:108px;text-align:right}
.row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row{flex-wrap:wrap}.row .t{flex:1 1 0}
.ctl{order:3;flex-basis:100%;display:flex;gap:6px;align-items:center;padding-left:40px;flex-wrap:wrap}
.ctl .num{width:120px}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row.done .t>b,.row.done .t>span.nm{text-decoration:line-through;color:var(--mut)}
.ck{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid #D9C9B4;display:grid;place-items:center;background:#fff;transition:all .2s;font-size:15px;color:#fff}
.ck.on{background:var(--sage);border-color:var(--sage)}
.x{font-size:17px;padding:6px;opacity:.55;flex:none}
.x:active{opacity:1}
.mini{background:var(--bg);border-radius:10px;padding:6px 9px;font-size:14px;flex:none}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--mut);white-space:nowrap}
.pill.hot{background:var(--red2);color:var(--red)}
.pill.warm{background:var(--mel2);color:#9A6A12}
.pill.ok{background:var(--sage2);color:var(--sage)}
.who{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;vertical-align:1px}
.who.le{background:var(--sage2);color:var(--leo)}
.who.li{background:var(--rosa2);color:#B4566E}
.who.ca{background:var(--mel2);color:#9A6A12}
.empty{color:var(--mut);text-align:center;padding:18px 8px}
.total{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:15px}
.seg{display:flex;gap:6px;background:#F3E9DB;padding:4px;border-radius:16px;margin:4px 0 6px;overflow-x:auto}
.seg button{flex:1;padding:8px 2px;border-radius:12px;font-weight:700;font-size:12.5px;color:var(--mut);white-space:nowrap}
.seg button.sel{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(80,50,20,.1)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kpi div{background:var(--bg);border-radius:16px;padding:10px 12px;font-size:13px;color:var(--mut)}
.kpi b{display:block;color:var(--ink);font-size:18px;font-family:Fraunces,serif;font-weight:600}
.kpi .wide{grid-column:1/-1}
.bar{height:10px;border-radius:999px;background:#F1E6D7;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
/* topo */
.hero{display:flex;align-items:center;gap:12px;margin:6px 0 10px}
.hero svg{flex:none}
.hero h1{font-size:30px;line-height:1}
.gear{margin-left:auto;font-size:22px;background:var(--card);width:44px;height:44px;border-radius:14px;box-shadow:var(--sh)}
.pagetitle{display:flex;align-items:center;gap:10px;margin:8px 0 10px}
.pagetitle .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px}
/* home */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{text-align:left;background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--sh);border:1px solid rgba(239,227,211,.7);display:flex;flex-direction:column;gap:4px;transition:transform .12s;min-height:118px}
.tile .e{font-size:26px}
.tile b.n{font-family:Fraunces,serif;font-size:26px;font-weight:600;line-height:1.1}
.tile.big{grid-column:1/-1;background:linear-gradient(135deg,#FFF7EC,#FBE7D9);min-height:0}
.tile.big .kpi div{background:rgba(255,255,255,.75)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,249,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0));z-index:20}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mut);padding:4px 6px;border-radius:14px;min-width:58px}
nav button span{font-size:22px;transition:transform .2s}
nav button.sel{color:var(--terra)}
nav button.sel span{transform:translateY(-2px) scale(1.12)}
/* caixinhas */
.cx{display:flex;gap:14px;align-items:center}
.jar{width:84px;height:100px;flex:none;overflow:visible}
.cx .info{flex:1;min-width:0}
.cx .nm{font-family:Fraunces,serif;font-size:19px;font-weight:600}
.cx .bar{height:14px;margin:8px 0 6px}
.cx .bar i{background:repeating-linear-gradient(45deg,rgba(255,255,255,.25) 0 8px,transparent 8px 16px),var(--c);background-size:22px 22px,auto;animation:stripes 1.2s linear infinite}
@keyframes stripes{to{background-position:22px 0,0 0}}
.wave{animation:wave 2.6s linear infinite}
.wave2{animation:wave 3.8s linear infinite reverse;opacity:.5}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.liq{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.bob{animation:bob 3s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes bob{50%{transform:translateY(-3px) rotate(-4deg)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;transition:transform .12s}
.chip.sel{border-color:var(--terra);background:var(--terra2);color:var(--terra)}
.mov{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.mov.open{display:block;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.coin{position:fixed;font-size:26px;z-index:60;pointer-events:none;animation:coin .9s cubic-bezier(.5,0,.75,0) forwards}
@keyframes coin{from{transform:translateY(-90px) rotate(0);opacity:0}20%{opacity:1}to{transform:translateY(0) rotate(360deg);opacity:0}}
/* pendências */
.urg{display:flex;gap:6px}
.urg button{flex:1;padding:10px 4px;border-radius:14px;border:1.5px solid var(--line);font-weight:700;font-size:13px;background:#fff;white-space:nowrap}
.urg button.sel.u1{background:var(--sage2);border-color:var(--sage);color:var(--sage)}
.urg button.sel.u2{background:var(--mel2);border-color:var(--mel);color:#9A6A12}
.urg button.sel.u3{background:var(--red2);border-color:var(--red);color:var(--red)}
.pd{border-left:5px solid transparent;padding-left:10px}
.pd.u1{border-color:var(--sage)}.pd.u2{border-color:var(--mel)}.pd.u3{border-color:var(--red)}
.pd.gone{animation:gone .45s ease forwards}
@keyframes gone{to{opacity:0;transform:translateX(30px);height:0;padding:0}}
/* mercado */
.mk{font-size:17px;padding:14px 2px}
.mk .x{opacity:.7;font-size:20px;background:var(--bg);border-radius:12px;width:42px;height:42px}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(59,47,39,.35);z-index:40;display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
#sheet .in{background:var(--bg);width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px)}}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;opacity:0;transition:all .3s;z-index:70;max-width:90vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.cf{position:fixed;top:-20px;z-index:65;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.sync{font-size:13px;text-align:center;color:var(--mut);padding:6px 10px;background:var(--mel2);border-radius:12px;margin:4px 0 8px}
/* login */
.login{max-width:380px;margin:12vh auto 0;text-align:center;padding:0 20px}
.login input{width:100%;margin:6px 0}
.login .btn{width:100%;margin-top:8px;padding:14px}
.flow{display:flex;height:22px;border-radius:999px;overflow:hidden;background:#F1E6D7;margin:6px 0}
.flow i{height:100%;transition:width .9s}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mut);margin-top:6px}
.leg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.lrow{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:15px}
.lrow .lb{width:118px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .bar{flex:1}
.lrow b{width:96px;text-align:right;flex:none;font-size:14px}
.imp label{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--line)}
.imp input[type=checkbox]{width:22px;height:22px;accent-color:var(--terra)}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="in" id="sheetIn"></div></div>
<div id="toast"></div>

<script>
/* ================== base ================== */
const $=s=>document.querySelector(s),gv=i=>($('#'+i)||{}).value||'';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m$=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=s=>{s=String(s==null?'':s).replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return +s||0};
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ym=()=>today().slice(0,7);
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const mesN=M=>MES[+M.slice(5)-1]+' '+M.slice(0,4);
const shiftM=(M,d)=>{const x=new Date(+M.slice(0,4),+M.slice(5)-1+d,1);return x.getFullYear()+'-'+pad(x.getMonth()+1)};
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const tt=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const nrm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const COLS=['fx','pc','pt','en','cx','pend','merc','freq','lfx','lpt','len'];
const LK='nosso-lar-v1';
let S={};COLS.forEach(c=>S[c]=[]);
let lm=ym(),ME='',tab='home',fsub='res',resM=ym(),newUrg=2,openMov=null,showDone=false,syncMsg='',booted=false;
const prevPct={};

/* ================== dados ================== */
const store={remote:null,
  loadLocal(){try{const r=JSON.parse(localStorage.getItem(LK)||'null');if(r)COLS.forEach(c=>S[c]=r[c]||[])}catch(e){}},
  saveLocal(){if(!this.remote)try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}}};
function put(col,o,quiet){const a=S[col],i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o);
  if(store.remote)store.remote.put(col,o);else store.saveLocal();if(!quiet)render()}
function upd(col,id,patch){const x=S[col].find(a=>a.id===id);if(!x)return;put(col,Object.assign({},x,patch))}
function del(col,id,quiet){S[col]=S[col].filter(x=>x.id!==id);if(store.remote)store.remote.del(col,id);else store.saveLocal();if(!quiet)render()}
function ren(col,id){const x=S[col].find(a=>a.id===id);if(!x)return;const k=x.n!=null?'n':'t';const v=prompt('Novo nome:',x[k]);if(v&&v.trim())upd(col,id,{[k]:v.trim()})}
function delC(col,id,what){if(confirm('Apagar '+(what||'este item')+'?'))del(col,id)}
let pendingRender=false;
function remoteRender(){const a=document.activeElement;if(a&&a.closest&&a.closest('#app')&&/INPUT|TEXTAREA/.test(a.tagName)&&a.value){pendingRender=true;return}render()}
document.addEventListener('focusout',()=>{if(pendingRender){pendingRender=false;setTimeout(()=>{const a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.value){pendingRender=true;return}render()},350)}});

/* ================== efeitos ================== */
let tT;function toast(t){const e=$('#toast');e.innerHTML=t;e.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('on'),2300)}
function confetti(n){n=n||70;const em=['🎉','💛','🏡','✨','🌼','🧡','🎈'],cs=['#C96F4A','#6F8F72','#E0A43A','#D47A90','#F2C9A0'];
  for(let i=0;i<n;i++){const s=document.createElement('div');s.className='cf';const isE=Math.random()<.35;
    if(isE){s.textContent=em[i%em.length];s.style.fontSize=(16+Math.random()*14)+'px'}else{s.style.width=s.style.height=(6+Math.random()*7)+'px';s.style.background=cs[i%cs.length];s.style.borderRadius=Math.random()<.5?'50%':'2px'}
    s.style.left=Math.random()*100+'vw';s.style.animationDuration=(1.8+Math.random()*1.8)+'s';s.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),4400)}}
function sparkle(ev,em){const x=ev&&ev.clientX!=null?ev.clientX:innerWidth/2,y=ev&&ev.clientY!=null?ev.clientY:innerHeight/2;
  for(let i=0;i<9;i++){const s=document.createElement('div');s.textContent=em||'✨';s.style.cssText=`position:fixed;left:${x}px;top:${y}px;z-index:66;pointer-events:none;font-size:18px;transition:all .7s cubic-bezier(.2,.8,.2,1)`;document.body.appendChild(s);
    const a=Math.PI*2*i/9,r=40+Math.random()*30;requestAnimationFrame(()=>{s.style.transform=`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(.6)`;s.style.opacity=0});setTimeout(()=>s.remove(),800)}}

/* ================== pessoas ================== */
const who=q=>q?`<span class="who ${q==='Laura'?'li':q==='Léo'?'le':'ca'}">${esc(q)}</span>`:'';
function setMe(n){ME=n;try{localStorage.setItem('nl-me',n)}catch(e){}closeSheet();render();toast('Oi, '+n+'! 💛')}
function askMe(){openSheet(`<h2 style="margin-top:0">Quem está usando este celular?</h2><p class="mut">Assim o app mostra quem lançou e pagou cada coisa.</p><div class="add"><button class="btn sage" style="flex:1;padding:16px" onclick="setMe('Léo')">🧔 Léo</button><button class="btn" style="flex:1;padding:16px;background:var(--rosa)" onclick="setMe('Laura')">👩 Laura</button></div>`)}

/* ================== cálculos ================== */
const gsL=(x,M)=>((x.gs||{})[M])||[],gsT=(x,M)=>tt(gsL(x,M),a=>a.v);
const pgOf=(x,M)=>(x.pgs||{})[M];
function calc(M){const fx=S.fx,pc=S.pc.filter(x=>x.f>0||pgOf(x,M));
  const fv=x=>x.gr?Math.max(+x.v||0,gsT(x,M)):+x.v||0,fp=x=>x.gr?gsT(x,M):(pgOf(x,M)?+x.v||0:0);
  const ent=tt(S.en,e=>e.v*(e.q||1)),cont=tt(fx,fv)+tt(pc,x=>x.v),pago=tt(fx,fp)+tt(pc.filter(x=>pgOf(x,M)),x=>x.v),pont=tt(S.pt.filter(x=>!x.ok),x=>x.v);
  return {M,pc,ent,cont,pago,pont,sobra:ent-cont-pont,falta:cont-pago+pont}}
function venc(x,M){const p=pgOf(x,M);if(!x.dia)return p?`<small>✔ pago</small> ${who(p)}`:'<small>sem vencimento</small>';
  const last=new Date(+M.slice(0,4),+M.slice(5),0).getDate(),dd=Math.min(x.dia,last),diff=dd-(+today().slice(8));
  if(p)return `<small>✔ pago · dia ${dd}</small> ${who(p)}`;
  return diff<0?`<span class="pill hot">venceu dia ${dd}</span>`:diff===0?'<span class="pill hot">vence HOJE</span>':diff<=3?`<span class="pill warm">vence em ${diff} dia(s)</span>`:`<small>vence dia ${dd}</small>`}

/* ================== navegação ================== */
const TABS=[['home','🏡','Início'],['fin','💰','Finanças'],['cx','🫙','Caixinhas'],['lica','👶','Lica'],['merc','🛒','Mercado']];
function go(t,s){tab=t;if(s)fsub=s;openMov=null;render();scrollTo(0,0)}
function fs(s){fsub=s;render()}
function nav(){$('#nav').innerHTML=TABS.map(([k,e,n])=>`<button class="${tab===k?'sel':''}" onclick="go('${k}')"><span>${e}</span>${n}</button>`).join('')}
function title(e,n,bg,sub){return `<div class="pagetitle"><div class="ic" style="background:${bg}">${e}</div><div><h1 style="font-size:25px">${n}</h1>${sub?`<small>${sub}</small>`:''}</div></div>`}

/* ================== início ================== */
const HOUSE=`<svg width="58" height="58" viewBox="0 0 64 64"><circle cx="32" cy="34" r="29" fill="#F7E0D3"/><path d="M14 31 L32 15 L50 31" fill="none" stroke="#C96F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 29 V48 Q19 50 21 50 H43 Q45 50 45 48 V29" fill="#FFFDF9" stroke="#C96F4A" stroke-width="3" stroke-linejoin="round"/><rect x="40" y="16" width="5" height="9" rx="1.5" fill="#C96F4A"/><path class="bob" d="M32 44 C26 39 25.5 35.5 28 33.8 C30 32.5 31.5 33.6 32 35 C32.5 33.6 34 32.5 36 33.8 C38.5 35.5 38 39 32 44Z" fill="#D47A90"/></svg>`;
function home(){const c=calc(ym()),h=new Date().getHours(),sa=h<5?'Boa madrugada':h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  const pa=S.pend.filter(x=>!x.ok),urg=pa.filter(x=>x.urg===3||late(x)).length;
  const cxs=S.cx.slice().sort((a,b)=>pctOf(b)-pctOf(a)).slice(0,3);
  let o=`<div class="hero">${HOUSE}<div><small>${sa}${ME?', '+ME:''} ✨</small><h1>Nosso Lar</h1></div><button class="gear" onclick="openSet()">⚙️</button></div>${syncMsg?`<div class="sync">${syncMsg}</div>`:''}`;

function tgFx(id,ev){const x=S.fx.find(a=>a.id===id),M=ym(),p=Object.assign({},x.pgs);if(p[M])delete p[M];else{p[M]=ME||'—';sparkle(ev,'✨')}upd('fx',id,{pgs:p})}

  const t=tt(gs[M],a=>a.v);upd('fx',id,{gs});toast(t>x.v?'⚠️ Passou do previsto em '+m$(t-x.v):'✅ Lançado! Resta '+m$(x.v-t));sparkle(ev,'🪙')}

/* ---------- resumo ---------- */
function resumo(M){const out=[],pay={};const addP=(q,v)=>{q=q&&q!=='—'?q:'Sem nome';pay[q]=(pay[q]||0)+v};
  let fixos=0,poucos=[],parc=0,pont=0;
  S.fx.forEach(x=>{if(x.gr){const t=gsT(x,M);if(t){poucos.push([x.n,t]);gsL(x,M).forEach(a=>addP(a.q,a.v))}}else if(pgOf(x,M)){fixos+=+x.v||0;addP(pgOf(x,M),+x.v||0)}});
  S.pc.forEach(x=>{if(pgOf(x,M)){parc+=+x.v||0;addP(pgOf(x,M),+x.v||0)}});
  S.pt.forEach(x=>{if(x.ok&&x.okM===M){pont+=+x.v||0;addP(x.quem,+x.v||0)}});
  let guard=0;S.cx.forEach(x=>(x.mov||[]).forEach(m=>{if(m.d&&m.d.slice(0,7)===M)guard+=m.v}));
  const ent=tt(S.en,e=>e.v*(e.q||1)),entBy={};S.en.forEach(e=>{const p=e.p||'Casa';entBy[p]=(entBy[p]||0)+e.v*(e.q||1)});
  const saiu=fixos+parc+pont+tt(poucos,a=>a[1]);
  return {ent,entBy,saiu,fixos,poucos,parc,pont,guard,pay,sobra:ent-saiu-guard}}

function impDo(){const M=ym();let n=0;document.querySelectorAll('#sheetIn input[type=checkbox]:checked').forEach((c,k)=>{const col=c.dataset.c,x=IMP.l[col][+c.dataset.i],id=uid()+k;let o;

  else if(col==='pc')o={id,n:x.n,v:+x.v||0,f:+x.f||0,pgs:x.pg?{[x.pg]:'Léo'}:{}};
  else if(col==='pt')o={id,n:x.n,v:+x.v||0,ok:false,por:'Léo'};
  else if(col==='lfx'){const pgs={};(x.pm||[]).forEach(m=>pgs[m]='Léo');o={id,n:x.n,v:+x.v||0,dia:+x.dia||0,pgs}}
  else if(col==='lavh'){['len','lpt'].forEach(kk=>(IMP[kk]||[]).forEach((y,j)=>{if(S[kk].some(a=>a.n===y.n&&a.d===y.d&&+a.v===+y.v))return;put(kk,{id:uid()+k*1000+j+(kk==='lpt'?500:0),n:y.n||'Entrada',v:+y.v||0,d:y.d||today(),por:'Léo'},1);n++}));return}
  else o=Object.assign({id,n:x.n,v:+x.v||0,p:'Léo'},x.q?{q:+x.q}:{});
  put(col,o,1);n++});closeSheet();IMP=null;render();if(n){toast('🏡 '+n+' item(ns) trazidos pra casa!');confetti(40)}}
